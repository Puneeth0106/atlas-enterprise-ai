name: Atlas CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      RIUS_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q app worker scripts tests
      - name: Check browser JavaScript syntax
        run: node --check app/static/js/app.js
      - name: Run mocked regression and HTTP smoke tests
        run: python -m unittest discover -s tests -v

  container:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --tag atlas-smoke:ci .
      - name: Start image without service credentials
        run: |
          docker run --detach --name atlas-smoke \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env RIUS_DISABLED=true \
            --publish 127.0.0.1:8000:8000 atlas-smoke:ci
      - name: Verify runtime user and packaged files
        run: |
          test "$(docker exec atlas-smoke id -u)" = "10001"
          docker exec atlas-smoke python -c "from pathlib import Path; from worker.ingest import process_s3_key; assert not list(Path('/srv').rglob('.env*'))"
      - name: Check container HTTP surface
        run: python3 scripts/smoke_http.py http://127.0.0.1:8000
      - name: Show container logs on failure
        if: failure()
        run: docker logs atlas-smoke
      - name: Remove smoke container
        if: always()
        run: docker rm --force atlas-smoke

  postgres:
    name: PostgreSQL transactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_test -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      RIUS_DISABLED: 'true'
      ATLAS_TEST_DATABASE_URL: postgresql://atlas_test:atlas_test@127.0.0.1:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify real database transactions and ingestion claims
        run: python -m unittest discover -s tests/integration -v
